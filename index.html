<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NavMeteo - Navigazione & Lossodromia</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --bg-color: #0b131f;
            --card-bg: #162235;
            --accent-orange: #FF6B00;
            --text-main: #e0e6ed;
            --text-muted: #8a99ad;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #app-header {
            padding: 12px 20px;
            background: #060a12;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e2d42;
        }

        h1 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--accent-orange);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #main-container {
            display: flex;
            flex: 1;
            flex-direction: column;
            position: relative;
        }

        /* Mappa Leaflet */
        #map {
            width: 100%;
            height: 55vh;
            z-index: 1;
        }

        /* Pannello Dashboard Navigazione */
        #dashboard {
            flex: 1;
            background-color: var(--card-bg);
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            overflow-y: auto;
            border-top: 2px solid var(--accent-orange);
        }

        .telemetry-card {
            background: rgba(11, 19, 31, 0.6);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #23354d;
            text-align: center;
        }

        .telemetry-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .telemetry-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: #fff;
        }

        .unit {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Modale / Input Waypoint */
        #waypoint-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(11, 19, 31, 0.9);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--accent-orange);
            display: flex;
            gap: 8px;
            align-items: center;
        }

        input {
            background: #162235;
            border: 1px solid #23354d;
            color: #fff;
            padding: 6px;
            border-radius: 4px;
            width: 90px;
            font-size: 0.85rem;
        }

        button {
            background: var(--accent-orange);
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div id="app-header">
        <h1>NavMeteo</h1>
        <span id="gps-status" style="font-size: 0.8rem; color: #00ff88;">GPS Attivo</span>
    </div>

    <div id="main-container">
        <!-- Controllo inserimento Waypoint rapido -->
        <div id="waypoint-controls">
            <input type="number" id="wp-lat" step="any" placeholder="Lat (N)">
            <input type="number" id="wp-lon" step="any" placeholder="Lon (E)">
            <button onclick="setWaypointFromInput()">Imposta WP</button>
        </div>

        <!-- Elemento Mappa Leaflet -->
        <div id="map"></div>

        <!-- Telemetria Navigazione -->
        <div id="dashboard">
            <div class="telemetry-card">
                <div class="telemetry-label">Posizione GPS</div>
                <div class="telemetry-value" id="val-pos">--° --.--'</div>
            </div>
            <div class="telemetry-card">
                <div class="telemetry-label">Waypoint</div>
                <div class="telemetry-value" id="val-wp">Non Impostato</div>
            </div>
            <div class="telemetry-card">
                <div class="telemetry-label">Distanza (Lossodromia)</div>
                <div class="telemetry-value"><span id="val-dist">--.-</span> <span class="unit">NM</span></div>
            </div>
            <div class="telemetry-card">
                <div class="telemetry-label">Rilevamento (BRG)</div>
                <div class="telemetry-value"><span id="val-brg">---</span><span class="unit">°</span></div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Inizializzazione Coordinate di Default (Bari - Mare Adriatico)
        let currentPos = [41.1259, 16.8721]; 
        let waypointPos = null;

        // Inizializzazione Mappa Leaflet
        const map = L.map('map').setView(currentPos, 11);

        // Layer Cartografico OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Icona Imbarcazione / Posizione Corrente
        const posMarker = L.marker(currentPos).addTo(map)
            .bindPopup("Posizione Corrente")
            .openPopup();

        let wpMarker = null;
        let rhumbLine = null; // Linea Lossodromica

        // Pulsante sulla mappa per aggiungere Waypoint al click
        map.on('click', function(e) {
            setWaypoint(e.latlng.lat, e.latlng.lng);
        });

        // Imposta o aggiorna il Waypoint
        function setWaypoint(lat, lng) {
            waypointPos = [lat, lng];

            // Aggiorna o crea il marker del Waypoint
            if (wpMarker) {
                wpMarker.setLatLng(waypointPos);
            } else {
                wpMarker = L.marker(waypointPos, { opacity: 0.9 }).addTo(map)
                    .bindPopup("Waypoint Destinazione");
            }

            // Popola i campi input
            document.getElementById('wp-lat').value = lat.toFixed(4);
            document.getElementById('wp-lon').value = lng.toFixed(4);

            updateNavigation();
        }

        function setWaypointFromInput() {
            const lat = parseFloat(document.getElementById('wp-lat').value);
            const lng = parseFloat(document.getElementById('wp-lon').value);
            if (!isNaN(lat) && !isNaN(lng)) {
                setWaypoint(lat, lng);
                map.panTo([lat, lng]);
            }
        }

        // Calcolo della Lossodromia (Linea Retta su proiezione Mercatore)
        function updateNavigation() {
            if (!currentPos || !waypointPos) return;

            // 1. Tracciamento / Aggiornamento Linea Lossodromica Fluorescente
            if (rhumbLine) {
                rhumbLine.setLatLngs([currentPos, waypointPos]);
            } else {
                rhumbLine = L.polyline([currentPos, waypointPos], {
                    color: '#FF6B00',
                    weight: 3,
                    dashArray: '8, 6', // Tratteggiato stile nautico
                    opacity: 0.9
                }).addTo(map);
            }

            // 2. Calcolo Distanza Lossodromica (Approssimazione in Miglia Nautiche - NM)
            const distMeters = map.distance(currentPos, waypointPos);
            const distNM = (distMeters / 1852).toFixed(2);

            // 3. Calcolo Rilevamento / Bearing (BRG)
            const brg = calculateBearing(currentPos[0], currentPos[1], waypointPos[0], waypointPos[1]);

            // Aggiornamento Interfaccia Telemetria
            document.getElementById('val-pos').innerText = formatDMM(currentPos[0], currentPos[1]);
            document.getElementById('val-wp').innerText = formatDMM(waypointPos[0], waypointPos[1]);
            document.getElementById('val-dist').innerText = distNM;
            document.getElementById('val-brg').innerText = Math.round(brg);
        }

        // Calcolo del Bearing iniziale (Rilevamento) tra due coordinate
        function calculateBearing(lat1, lon1, lat2, lon2) {
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;

            const y = Math.sin(Δλ) * Math.cos(φ2);
            const x = Math.cos(φ1) * Math.sin(φ2) -
                      Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
            
            const θ = Math.atan2(y, x);
            return (θ * 180 / Math.PI + 360) % 360;
        }

        // Formattazione Coordinate in Gradi e Minuti Decimali (DMM)
        function formatDMM(lat, lon) {
            const formatLat = (val) => {
                const ns = val >= 0 ? 'N' : 'S';
                const abs = Math.abs(val);
                const deg = Math.floor(abs);
                const min = ((abs - deg) * 60).toFixed(2);
                return `${deg}°${min}'${ns}`;
            };
            const formatLon = (val) => {
                const ew = val >= 0 ? 'E' : 'W';
                const abs = Math.abs(val);
                const deg = Math.floor(abs);
                const min = ((abs - deg) * 60).toFixed(2);
                return `${deg}°${min}'${ew}`;
            };
            return `${formatLat(lat)} ${formatLon(lon)}`;
        }

        // Geolocalizzazione GPS in tempo reale
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    currentPos = [position.coords.latitude, position.coords.longitude];
                    posMarker.setLatLng(currentPos);
                    updateNavigation();
                },
                (error) => console.warn("GPS non disponibile o permesso negato:", error),
                { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 }
            );
        }
    </script>
</body>
</html>
