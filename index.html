<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Gestione Rotta e Meteo</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f7f6; }
    .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .controls { margin-top: 10px; display: flex; gap: 10px; }
    button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-add { background-color: #2e7d32; color: white; }
    .btn-delete-last { background-color: #f57c00; color: white; }
    .btn-clear-all { background-color: #c62828; color: white; }
    ul { list-style-type: square; }
  </style>
</head>
<body>

  <!-- Scheda Meteo (Aggiornamento automatico ogni 60s) -->
  <div class="card">
    <h2>Meteo in Tempo Reale</h2>
    <p>Temperatura: <strong id="temp">--</strong></p>
    <p>Vento: <strong id="wind">--</strong></p>
    <p><small>Ultimo aggiornamento: <span id="last-update">Mai</span></small></p>
  </div>

  <!-- Scheda Gestione Rotta e Waypoint -->
  <div class="card">
    <h2>Gestione Rotta Navigazione</h2>
    
    <div class="controls">
      <button class="btn-add" onclick="addWaypointPrompt()">+ Aggiungi Waypoint</button>
      <button class="btn-delete-last" onclick="removeLastWaypoint()">Cancella Ultimo Waypoint</button>
      <button class="btn-clear-all" onclick="clearRoute()">Cancella Intera Rotta</button>
    </div>

    <h3>Lista Waypoint Rotta:</h3>
    <ul id="waypoint-list">
      <li><em>Nessun waypoint inserito</em></li>
    </ul>
  </div>

  <script>
    // ==========================================
    // 1. GESTIONE AGGIORNAMENTO METEO (OGNI 60s)
    // ==========================================
    let weatherTimer = null;

    async function fetchWeatherData() {
      try {
        // Esempio con API di prova (sostituire con la propria chiave API se necessario)
        const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=41.1259&longitude=16.8721&current_weather=true');
        if (!response.ok) throw new Error('Errore di rete nel recupero meteo');
        
        const data = await response.json();
        updateWeatherUI(data.current_weather);
      } catch (error) {
        console.error('Aggiornamento meteo fallito:', error);
      }
    }

    function updateWeatherUI(weather) {
      document.getElementById('temp').textContent = `${weather.temperature} °C`;
      document.getElementById('wind').textContent = `${weather.windspeed} km/h`;
      document.getElementById('last-update').textContent = new Date().toLocaleTimeString();
    }

    function startWeatherUpdates() {
      fetchWeatherData(); // Primo caricamento immediato
      weatherTimer = setInterval(fetchWeatherData, 60000); // Aggiornamento ogni 60 secondi
    }

    // Risparmio risorse quando la scheda non è visibile
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        clearInterval(weatherTimer);
      } else {
        startWeatherUpdates();
      }
    });

    // Avvio del ciclo meteo
    startWeatherUpdates();


    // ==========================================
    // 2. GESTIONE ROTTA E WAYPOINT
    // ==========================================
    let routeWaypoints = [];

    // Aggiungi un waypoint
    function addWaypoint(name) {
      if (!name) return;
      routeWaypoints.push(name);
      renderRoute();
    }

    function addWaypointPrompt() {
      const name = prompt("Inserisci il nome del waypoint (es. WP1, Capo Leuca, ecc.):");
      if (name && name.trim() !== "") {
        addWaypoint(name.trim());
      }
    }

    // Cancella l'ultimo waypoint inserito
    function removeLastWaypoint() {
      if (routeWaypoints.length === 0) {
        alert("Non ci sono waypoint da cancellare.");
        return;
      }
      const removed = routeWaypoints.pop();
      renderRoute();
      console.log(`Rimosso waypoint: ${removed}`);
    }

    // Cancella l'intera rotta
    function clearRoute() {
      if (routeWaypoints.length === 0) {
        alert("La rotta è già vuota.");
        return;
      }
      if (confirm("Sei sicuro di voler cancellare l'intera rotta?")) {
        routeWaypoints = [];
        renderRoute();
      }
    }

    // Aggiorna la vista HTML dei waypoint
    function renderRoute() {
      const listElement = document.getElementById('waypoint-list');
      listElement.innerHTML = '';

      if (routeWaypoints.length === 0) {
        listElement.innerHTML = '<li><em>Nessun waypoint inserito</em></li>';
        return;
      }

      routeWaypoints.forEach((wp, index) => {
        const li = document.createElement('li');
        li.textContent = `Waypoint ${index + 1}: ${wp}`;
        listElement.appendChild(li);
      });
    }
  </script>
</body>
</html>
