<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NavMeteo - Navigazione & Lossodromia</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --bg-color: #0b131f;
            --card-bg: #162235;
            --accent-orange: #FF6B00;
            --text-main: #e0e6ed;
            --text-muted: #8a99ad;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #app-header {
            padding: 12px 20px;
            background: #060a12;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e2d42;
        }

        h1 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--accent-orange);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #main-container {
            display: flex;
            flex: 1;
            flex-direction: column;
            position: relative;
        }

        /* Mappa Leaflet */
        #map {
            width: 100%;
            height: 50vh;
            z-index: 1;
        }

        /* Pannello Dashboard Navigazione */
        #dashboard {
            flex: 1;
            background-color: var(--card-bg);
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            overflow-y: auto;
            border-top: 2px solid var(--accent-orange);
        }

        .telemetry-card {
            background: rgba(11, 19, 31, 0.6);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #23354d;
            text-align: center;
        }

        .telemetry-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .telemetry-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
        }

        .unit {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Modale / Input Waypoint DMS */
        #waypoint-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(11, 19, 31, 0.95);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--accent-orange);
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .dms-row {
            display: flex;
            gap: 4px;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .dms-row label {
            width: 30px;
            font-weight: bold;
            color: var(--accent-orange);
        }

        input, select {
            background: #162235;
            border: 1px solid #23354d;
            color: #fff;
            padding: 5px;
            border-radius: 4px;
            font-size: 0.85rem;
            text-align: center;
        }

        input[type="number"] {
            width: 45px;
        }

        input.sec-input {
            width: 55px;
        }

        button {
            background: var(--accent-orange);
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 4px;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div id="app-header">
        <h1>NavMeteo</h1>
        <span id="gps-status" style="font-size: 0.8rem; color: #00ff88;">GPS Attivo</span>
    </div>

    <div id="main-container">
        <!-- Controllo Inserimento Waypoint in GG MM SS -->
        <div id="waypoint-controls">
            <div style="font-size:0.8rem; font-weight:bold; color:#fff; margin-bottom:2px;">Imposta Waypoint (DMS)</div>
            
            <!-- Latitudine -->
            <div class="dms-row">
                <label>LAT</label>
                <input type="number" id="wp-lat-deg" placeholder="GG" min="0" max="90">°
                <input type="number" id="wp-lat-min" placeholder="MM" min="0" max="59">'
                <input type="number" id="wp-lat-sec" class="sec-input" placeholder="SS" min="0" max="59.99" step="any">"
                <select id="wp-lat-dir">
                    <option value="N">N</option>
                    <option value="S">S</option>
                </select>
            </div>

            <!-- Longitudine -->
            <div class="dms-row">
                <label>LON</label>
                <input type="number" id="wp-lon-deg" placeholder="GG" min="0" max="180">°
                <input type="number" id="wp-lon-min" placeholder="MM" min="0" max="59">'
                <input type="number" id="wp-lon-sec" class="sec-input" placeholder="SS" min="0" max="59.99" step="any">"
                <select id="wp-lon-dir">
                    <option value="E">E</option>
                    <option value="W">W</option>
                </select>
            </div>

            <button onclick="setWaypointFromInput()">Imposta Waypoint</button>
        </div>

        <!-- Mappa Leaflet -->
        <div id="map"></div>

        <!-- Telemetria Navigazione -->
        <div id="dashboard">
            <div class="telemetry-card">
                <div class="telemetry-label">Posizione GPS (DMS)</div>
                <div class="telemetry-value" id="val-pos">--° --' --"</div>
            </div>
            <div class="telemetry-card">
                <div class="telemetry-label">Waypoint (DMS)</div>
                <div class="telemetry-value" id="val-wp">Non Impostato</div>
            </div>
            <div class="telemetry-card">
                <div class="telemetry-label">Distanza (Lossodromia)</div>
                <div class="telemetry-value"><span id="val-dist">--.-</span> <span class="unit">NM</span></div>
            </div>
            <div class="telemetry-card">
                <div class="telemetry-label">Rilevamento (BRG)</div>
                <div class="telemetry-value"><span id="val-brg">---</span><span class="unit">°</span></div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let currentPos = [41.1259, 16.8721]; 
        let waypointPos = null;

        const map = L.map('map').setView(currentPos, 11);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        const posMarker = L.marker(currentPos).addTo(map)
            .bindPopup("Posizione Corrente")
            .openPopup();

        let wpMarker = null;
        let rhumbLine = null;

        // Imposta Waypoint via Click sulla Mappa
        map.on('click', function(e) {
            setWaypoint(e.latlng.lat, e.latlng.lng);
        });

        function setWaypoint(lat, lng) {
            waypointPos = [lat, lng];

            if (wpMarker) {
                wpMarker.setLatLng(waypointPos);
            } else {
                wpMarker = L.marker(waypointPos).addTo(map)
                    .bindPopup("Waypoint Destinazione");
            }

            // Popola i campi input convertendo da Decimale a DMS
            const latDMS = decimalToDMS(lat, true);
            const lonDMS = decimalToDMS(lng, false);

            document.getElementById('wp-lat-deg').value = latDMS.deg;
            document.getElementById('wp-lat-min').value = latDMS.min;
            document.getElementById('wp-lat-sec').value = latDMS.sec;
            document.getElementById('wp-lat-dir').value = latDMS.dir;

            document.getElementById('wp-lon-deg').value = lonDMS.deg;
            document.getElementById('wp-lon-min').value = lonDMS.min;
            document.getElementById('wp-lon-sec').value = lonDMS.sec;
            document.getElementById('wp-lon-dir').value = lonDMS.dir;

            updateNavigation();
        }

        // Conversione da Input DMS a Decimale al click del pulsante
        function setWaypointFromInput() {
            const latDeg = parseFloat(document.getElementById('wp-lat-deg').value) || 0;
            const latMin = parseFloat(document.getElementById('wp-lat-min').value) || 0;
            const latSec = parseFloat(document.getElementById('wp-lat-sec').value) || 0;
            const latDir = document.getElementById('wp-lat-dir').value;

            const lonDeg = parseFloat(document.getElementById('wp-lon-deg').value) || 0;
            const lonMin = parseFloat(document.getElementById('wp-lon-min').value) || 0;
            const lonSec = parseFloat(document.getElementById('wp-lon-sec').value) || 0;
            const lonDir = document.getElementById('wp-lon-dir').value;

            const lat = dmsToDecimal(latDeg, latMin, latSec, latDir);
            const lon = dmsToDecimal(lonDeg, lonMin, lonSec, lonDir);

            setWaypoint(lat, lon);
            map.panTo([lat, lon]);
        }

        function updateNavigation() {
            if (!currentPos || !waypointPos) return;

            // Linea Lossodromica
            if (rhumbLine) {
                rhumbLine.setLatLngs([currentPos, waypointPos]);
            } else {
                rhumbLine = L.polyline([currentPos, waypointPos], {
                    color: '#FF6B00',
                    weight: 3,
                    dashArray: '8, 6',
                    opacity: 0.9
                }).addTo(map);
            }

            // Distanza Lossodromica in Miglia Nautiche (NM)
            const distMeters = map.distance(currentPos, waypointPos);
            const distNM = (distMeters / 1852).toFixed(2);

            // Bearing / Rilevamento (BRG)
            const brg = calculateBearing(currentPos[0], currentPos[1], waypointPos[0], waypointPos[1]);

            // Aggiorna Telemetria con formattazione GG MM SS
            document.getElementById('val-pos').innerText = formatDMSString(currentPos[0], currentPos[1]);
            document.getElementById('val-wp').innerText = formatDMSString(waypointPos[0], waypointPos[1]);
            document.getElementById('val-dist').innerText = distNM;
            document.getElementById('val-brg').innerText = Math.round(brg);
        }

        // Funzione di conversione da Gradi Decimali a DMS
        function decimalToDMS(val, isLat) {
            const dir = isLat ? (val >= 0 ? 'N' : 'S') : (val >= 0 ? 'E' : 'W');
            const abs = Math.abs(val);
            const deg = Math.floor(abs);
            const minFull = (abs - deg) * 60;
            const min = Math.floor(minFull);
            const sec = ((minFull - min) * 60).toFixed(1);
            return { deg, min, sec, dir };
        }

        // Funzione di conversione da DMS a Gradi Decimali
        function dmsToDecimal(deg, min, sec, dir) {
            let dec = deg + (min / 60) + (sec / 3600);
            if (dir === 'S' || dir === 'W') dec = -dec;
            return dec;
        }

        // Formattazione stringa leggibile GG° MM' SS" cardinale
        function formatDMSString(lat, lon) {
            const latDMS = decimalToDMS(lat, true);
            const lonDMS = decimalToDMS(lon, false);
            return `${latDMS.deg}°${latDMS.min}'${latDMS.sec}"${latDMS.dir} ${lonDMS.deg}°${lonDMS.min}'${lonDMS.sec}"${lonDMS.dir}`;
        }

        // Calcolo Rilevamento (BRG)
        function calculateBearing(lat1, lon1, lat2, lon2) {
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;

            const y = Math.sin(Δλ) * Math.cos(φ2);
            const x = Math.cos(φ1) * Math.sin(φ2) -
                      Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
            
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        // GPS Tracking
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    currentPos = [position.coords.latitude, position.coords.longitude];
                    posMarker.setLatLng(currentPos);
                    updateNavigation();
                },
                (error) => console.warn("GPS non disponibile:", error),
                { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 }
            );
        }
    </script>
</body>
</html>
